apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iff-postgres
  namespace: iff-audio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iff-postgres
  namespace: iff-audio
spec:
  replicas: 1
  # ReadWriteOnce data volume: never run the old and new pod side by side.
  strategy:
    type: Recreate
    # Clears the defaulted rollingUpdate on clusters that already ran RollingUpdate.
    rollingUpdate: null
  selector:
    matchLabels:
      app: iff-postgres
  template:
    metadata:
      labels:
        app: iff-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iff-api
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iff-api
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: iff-api
                  key: POSTGRES_DB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iff-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: iff-postgres
  namespace: iff-audio
spec:
  selector:
    app: iff-postgres
  ports:
    - port: 5432
      targetPort: 5432
